<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 566" role="img" aria-labelledby="title description">
  <title id="title">SJF4J published module dependency graph</title>
  <desc id="description">The processor depends on core and schema; schema and each backend adapter depend on core. Backend adapters expose their third-party libraries as API dependencies, with Parsson as a runtime dependency of JSON-P. The Spring module depends on core and Spring; the Spring Boot starter depends on the Spring module and Spring Boot.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#55738f"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1118" height="564" rx="14" fill="#f8fafc" stroke="#d8e2ea"/>
  <text x="42" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#1d344c">Published modules and their dependencies</text>
  <g fill="none" stroke="#55738f" stroke-width="2.5" stroke-linejoin="round">
    <path d="M215 167 V230" marker-end="url(#arrow)"/>
    <path d="M380 126 H405 V345 H490 V400" marker-end="url(#arrow)"/>
    <path d="M215 320 V365 H435 V400" marker-end="url(#arrow)"/>
    <path d="M575 265 V400" marker-end="url(#arrow)"/>
    <path d="M790 446 H750" marker-end="url(#arrow)"/>
    <path d="M930 365 V400" marker-end="url(#arrow)"/>
  </g>
  <rect x="50" y="75" width="330" height="92" rx="12" fill="#f4ecfb" stroke="#aa83c7" stroke-width="1.5"/>
  <text x="72" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="23" font-weight="700" fill="#51336b">sjf4j-processor</text>
  <text x="72" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#71568c">Compile-time annotation processor</text>
  <text x="72" y="154" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#7c6694">Depends on core + schema</text>
  <rect x="50" y="230" width="330" height="90" rx="12" fill="#edf2fd" stroke="#87a5d6" stroke-width="1.5"/>
  <text x="72" y="262" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#263f69">sjf4j-schema</text>
  <text x="72" y="286" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#405f8b">JSON Schema validation</text>
  <text x="72" y="307" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#5676a0">Optional runtime module</text>
  <rect x="432" y="75" width="638" height="190" rx="12" fill="#fff" stroke="#90a5b6" stroke-width="1.5"/>
  <text x="452" y="107" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="700" fill="#274157">Backend adapters</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#314e67">
    <text x="452" y="141">sjf4j-backend-jackson2</text>
    <text x="752" y="141">sjf4j-backend-jackson3</text>
    <text x="452" y="174">sjf4j-backend-gson</text>
    <text x="752" y="174">sjf4j-backend-fastjson2</text>
    <text x="452" y="207">sjf4j-backend-jsonp</text>
    <text x="752" y="207">sjf4j-backend-snake</text>
  </g>
  <text x="452" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#56768d">Include corresponding third-party libraries transitively</text>
  <rect x="400" y="400" width="350" height="92" rx="12" fill="#deedf8" stroke="#6e9fc5" stroke-width="1.5"/>
  <text x="424" y="436" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="750" fill="#1e527a">sjf4j-core</text>
  <text x="424" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#3c688a">Common APIs and object model</text>
  <text x="424" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#537d9d">Built-in Simple JSON + Properties</text>
  <rect x="790" y="273" width="280" height="92" rx="12" fill="#f3f6f9" stroke="#9aaebe" stroke-width="1.5"/>
  <text x="805" y="301" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#274157">sjf4j-spring-boot-starter</text>
  <text x="805" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#405f77">Spring Boot 3 auto-configuration</text>
  <text x="805" y="347" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#56768d">Depends on sjf4j-spring + Boot</text>
  <rect x="790" y="400" width="280" height="92" rx="12" fill="#f3f6f9" stroke="#9aaebe" stroke-width="1.5"/>
  <text x="805" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#274157">sjf4j-spring</text>
  <text x="805" y="454" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#405f77">Spring Framework 6.2+ integration</text>
  <text x="805" y="475" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#56768d">Depends on core + Spring</text>
  <line x1="48" y1="531" x2="86" y2="531" stroke="#55738f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="98" y="536" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#425970">Direct project dependency</text>
  <text x="400" y="536" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#425970">Third-party backend libraries: API dependencies (Parsson: runtime only)</text>
</svg>
