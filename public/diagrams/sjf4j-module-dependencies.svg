<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" role="img" aria-labelledby="title description">
  <title id="title">SJF4J published module dependency graph</title>
  <desc id="description">The sjf4j aggregate includes core, schema and six backend adapters. The processor depends on core and schema; schema and each backend adapter depend on core. The optional Spring Boot starter depends on core and Spring Boot. Third-party backend libraries must be added separately.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#55738f"/>
    </marker>
    <marker id="include" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#198c8b"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1118" height="638" rx="14" fill="#f8fafc" stroke="#d8e2ea"/>
  <text x="42" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#1d344c">Published modules and their dependencies</text>
  <g fill="none" stroke-width="2.5" stroke-linejoin="round">
    <path d="M205 175 V282" stroke="#198c8b" stroke-dasharray="7 6" marker-end="url(#include)"/>
    <path d="M390 126 H506 V260" stroke="#198c8b" stroke-dasharray="7 6" marker-end="url(#include)"/>
    <path d="M390 156 H412 V458 H503 V500" stroke="#198c8b" stroke-dasharray="7 6" marker-end="url(#include)"/>
    <path d="M733 136 H686 V216 H346 V282" stroke="#55738f" marker-end="url(#arrow)"/>
    <path d="M1064 140 H1085 V455 H702 V500" stroke="#55738f" marker-end="url(#arrow)"/>
    <path d="M230 375 V465 H475 V500" stroke="#55738f" marker-end="url(#arrow)"/>
    <path d="M744 426 V500" stroke="#55738f" marker-end="url(#arrow)"/>
    <path d="M785 547 H747" stroke="#55738f" marker-end="url(#arrow)"/>
  </g>
  <rect x="70" y="78" width="320" height="97" rx="12" fill="#e3f6f3" stroke="#58a9a3" stroke-width="1.5"/>
  <text x="92" y="111" font-family="system-ui, -apple-system, sans-serif" font-size="23" font-weight="700" fill="#164e4a">sjf4j</text>
  <text x="92" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#275c57">All-in-one bundle</text>
  <text x="92" y="157" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#3d756f">Core + schema + six adapters</text>
  <rect x="733" y="78" width="331" height="97" rx="12" fill="#f4ecfb" stroke="#aa83c7" stroke-width="1.5"/>
  <text x="755" y="111" font-family="system-ui, -apple-system, sans-serif" font-size="23" font-weight="700" fill="#51336b">sjf4j-processor</text>
  <text x="755" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#71568c">Compile-time annotation processor</text>
  <text x="755" y="157" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#7c6694">Depends on core + schema</text>
  <rect x="75" y="282" width="300" height="93" rx="12" fill="#edf2fd" stroke="#87a5d6" stroke-width="1.5"/>
  <text x="95" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#263f69">sjf4j-schema</text>
  <text x="95" y="339" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#405f8b">JSON Schema validation</text>
  <text x="95" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#5676a0">Optional runtime module</text>
  <rect x="470" y="260" width="594" height="166" rx="12" fill="#fff" stroke="#90a5b6" stroke-width="1.5"/>
  <text x="489" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="700" fill="#274157">Backend adapters</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#314e67">
    <text x="492" y="324">sjf4j-backend-jackson2</text>
    <text x="777" y="324">sjf4j-backend-jackson3</text>
    <text x="492" y="360">sjf4j-backend-gson</text>
    <text x="777" y="360">sjf4j-backend-fastjson2</text>
    <text x="492" y="396">sjf4j-backend-jsonp</text>
    <text x="777" y="396">sjf4j-backend-snake</text>
  </g>
  <rect x="392" y="500" width="352" height="91" rx="13" fill="#deedf8" stroke="#6e9fc5" stroke-width="1.8"/>
  <text x="416" y="537" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="750" fill="#1e527a">sjf4j-core</text>
  <text x="416" y="561" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#3c688a">Common APIs and object model</text>
  <text x="416" y="581" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#537d9d">Built-in Simple JSON + Properties</text>
  <rect x="785" y="500" width="279" height="91" rx="13" fill="#f3f6f9" stroke="#9aaebe" stroke-width="1.8"/>
  <text x="800" y="530" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#274157">sjf4j-spring-boot-starter</text>
  <text x="800" y="554" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#405f77">Optional Spring Boot 3 integration</text>
  <text x="800" y="575" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#56768d">Depends on core + Spring Boot</text>
  <line x1="48" y1="615" x2="86" y2="615" stroke="#198c8b" stroke-width="2.5" stroke-dasharray="7 6"/>
  <text x="94" y="620" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#425970">Bundle includes</text>
  <line x1="243" y1="615" x2="281" y2="615" stroke="#55738f" stroke-width="2.5"/>
  <text x="289" y="620" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#425970">Direct project dependency</text>
  <text x="580" y="620" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" fill="#425970">External backend libraries are separate dependencies</text>
</svg>