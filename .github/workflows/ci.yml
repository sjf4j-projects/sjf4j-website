name: Website CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test README synchronization
        run: node --test tests/sync-readme.test.mjs
      - name: Test Schema-to-Java generator
        run: npm run test:generator
      - name: Test internationalization routing
        run: npm run test:i18n
      - name: Check translation freshness (warnings only)
        run: npm run i18n:status
      - name: Build website and check internal links
        run: npm run docs:build
      - name: Validate published LLM documentation files
        run: node --test tests/llms.test.mjs
